name: KAMPRO Maestro Cloud

on:
  workflow_dispatch:

jobs:
  maestro-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Repair Android NDK 27.1.12297006 if needed
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          rm -rf "$ANDROID_HOME/ndk/27.1.12297006"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;27.1.12297006"

      - name: Build ARM-compatible debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Run KAMPRO Maestro smoke suite
        uses: mobile-dev-inc/action-maestro-cloud@v3.0.1
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          workspace: .maestro
          device-model: pixel_6
          device-os: android-33
          include-tags: smoke
          env: |
            CUSTOMER_EMAIL=${{ secrets.KAMPRO_CUSTOMER_EMAIL }}
            CUSTOMER_PASSWORD=${{ secrets.KAMPRO_CUSTOMER_PASSWORD }}
            PROFESSIONAL_EMAIL=${{ secrets.KAMPRO_PROFESSIONAL_EMAIL }}
            PROFESSIONAL_PASSWORD=${{ secrets.KAMPRO_PROFESSIONAL_PASSWORD }}
          timeout: 15
