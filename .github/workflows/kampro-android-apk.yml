name: KAMPRO Android APK Build
# Rebuild for approved map-first professional preview feature.
# Rebuild after compact ServicePicker layout correction (APK 68 baseline).

on:
  workflow_dispatch:
  push:
    branches: [main, feature/customer-location-and-auth-ux, fix/apk68-compact-service-picker]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/kampro-android-apk.yml"

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build installable Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      EXPO_PUBLIC_MSG91_TOKEN_AUTH: ${{ secrets.EXPO_PUBLIC_MSG91_TOKEN_AUTH }}
      EXPO_PUBLIC_MSG91_WIDGET_ID: ${{ secrets.EXPO_PUBLIC_MSG91_WIDGET_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required mobile build configuration
        run: |
          if [ -z "$EXPO_PUBLIC_MSG91_TOKEN_AUTH" ]; then
            echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_MSG91_TOKEN_AUTH."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_MSG91_WIDGET_ID" ]; then
            echo "::error::Missing GitHub Actions secret EXPO_PUBLIC_MSG91_WIDGET_ID. Add the MSG91 widget ID in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "MSG91 widget configuration is present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK on runner
        run: |
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms"
          echo "Android SDK is available at $ANDROID_HOME"
          java -version

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kampro-android-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

