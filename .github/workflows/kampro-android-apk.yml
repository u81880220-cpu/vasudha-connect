name: KAMPRO Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/kampro-android-apk.yml"

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK on runner
        run: |
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms"
          echo "Android SDK is available at $ANDROID_HOME"
          java -version

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kampro-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
