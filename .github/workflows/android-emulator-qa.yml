name: Vasudha Android Emulator UI QA

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: vasudha-android-emulator-qa
  cancel-in-progress: true

jobs:
  android-emulator-ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://bbweclhmbzwmflijppoi.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fE2u4A3S9YNOR_-imSZKJg_MQuxzPVX
      EXPO_PUBLIC_PAYMENT_PROVIDER: test
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      PROFESSIONAL_EMAIL: ${{ secrets.PROFESSIONAL_EMAIL }}
      PROFESSIONAL_PASSWORD: ${{ secrets.PROFESSIONAL_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Configure Android SDK tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -x "$SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            echo "$SDK_ROOT/cmdline-tools/bin" >> "$GITHUB_PATH"
          fi
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version || "$SDK_ROOT/cmdline-tools/bin/sdkmanager" --version || command -v sdkmanager

      - name: Install Android NDK 27.1
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;27.1.12297006"

      - name: Preinstall Android emulator image with retry
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"; fi
          IMAGE="system-images;android-34;google_apis;x86_64"
          for attempt in 1 2 3; do
            echo "Installing emulator image (attempt $attempt/3)"
            if "$SDKMANAGER" --install "$IMAGE"; then
              echo "Android emulator image installed."
              exit 0
            fi
            echo "SDK image install failed; clearing partial image and retrying..."
            rm -rf "$SDK_ROOT/system-images/android-34/google_apis/x86_64"
            rm -rf "$HOME/.android/cache"/* 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Android emulator system image could not be installed after three attempts."
          exit 1

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          if [ -x "$HOME/.maestro/bin/maestro" ]; then
            "$HOME/.maestro/bin/maestro" --version
          else
            echo "Maestro binary was not installed at $HOME/.maestro/bin/maestro"
            find "$HOME/.maestro" -maxdepth 4 -type f -name "maestro" -print || true
            exit 1
          fi

      - name: Validate Maestro test credentials
        run: |
          test -n "$CUSTOMER_EMAIL" || (echo "Missing GitHub Actions secret CUSTOMER_EMAIL"; exit 1)
          test -n "$CUSTOMER_PASSWORD" || (echo "Missing GitHub Actions secret CUSTOMER_PASSWORD"; exit 1)
          test -n "$PROFESSIONAL_EMAIL" || (echo "Missing GitHub Actions secret PROFESSIONAL_EMAIL"; exit 1)
          test -n "$PROFESSIONAL_PASSWORD" || (echo "Missing GitHub Actions secret PROFESSIONAL_PASSWORD"; exit 1)
          echo "Both test account credentials are configured."

      - name: Start Android emulator and run Maestro UI QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          force-avd-creation: true
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          emulator-boot-timeout: 1200
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro --version
            mkdir -p android-maestro-results
            export MAESTRO_DRIVER_STARTUP_TIMEOUT=180000
            timeout 15m maestro --verbose test --format junit --output android-maestro-results/report.xml --test-output-dir android-maestro-results .maestro

      - name: Upload Android UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vasudha-android-ui-qa-evidence
          path: |
            android-maestro-results
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
