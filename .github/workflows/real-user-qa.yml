name: Vasudha Free Real User QA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  real-user-web-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://bbweclhmbzwmflijppoi.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fE2u4A3S9YNOR_-imSZKJg_MQuxzPVX
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_PAYMENT_PROVIDER: test
      QA_CUSTOMER_EMAIL: demo.customer1@vasudha.test
      QA_CUSTOMER_PASSWORD: Demo@12345
      QA_PROFESSIONAL_EMAIL: demo.pro1@vasudha.test
      QA_PROFESSIONAL_PASSWORD: Demo@12345

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Install QA dependencies
        working-directory: qa
        run: npm install

      - name: Verify QA admin secret
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing GitHub secret SUPABASE_SERVICE_ROLE_KEY" && exit 1)

      - name: Seed QA demo accounts
        run: npm --workspace apps/mobile run demo:seed

      - name: Reset QA demo data
        run: node qa/e2e/reset-demo.mjs

      - name: Export Expo web app in free payment mode
        working-directory: apps/mobile
        run: npx expo export --platform web

      - name: Serve web build
        run: npx --yes serve apps/mobile/dist -l 4173 > /tmp/vasudha-server.log 2>&1 &

      - name: Verify web server
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vasudha-server.log || true
          exit 1

      - name: Install Chromium
        working-directory: qa
        run: npx playwright install --with-deps chromium

      - name: Run real-user QA
        working-directory: qa
        run: npx playwright test

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vasudha-real-user-qa-evidence
          path: |
            qa/test-results
            qa/playwright-report
