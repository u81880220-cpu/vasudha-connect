name: Vasudha Free Real User QA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  real-user-web-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_PAYMENT_PROVIDER: test
      QA_CUSTOMER_EMAIL: demo.customer1@vasudha.test
      QA_CUSTOMER_PASSWORD: Demo@12345
      QA_PROFESSIONAL_EMAIL: demo.pro1@vasudha.test
      QA_PROFESSIONAL_PASSWORD: Demo@12345

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Install QA dependencies
        working-directory: qa
        run: npm install

      - name: Seed QA demo accounts
        run: npm --workspace apps/mobile run demo:seed

      - name: Reset QA demo data
        run: node qa/e2e/reset-demo.mjs

      - name: Export Expo web app in free payment mode
        working-directory: apps/mobile
        run: npx expo export --platform web

      - name: Serve web build
        run: npx --yes http-server apps/mobile/dist -p 4173 > /tmp/vasudha-server.log 2>&1 &

      - name: Install Chromium
        working-directory: qa
        run: npx playwright install --with-deps chromium

      - name: Run real-user QA
        working-directory: qa
        run: npx playwright test

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vasudha-real-user-qa-evidence
          path: |
            qa/test-results
            qa/playwright-report
