name: Vasudha Android Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-config-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Install dependencies
        run: npm install

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Run Expo doctor
        run: npx expo-doctor

      - name: Validate Android native generation
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Verify Android project configuration
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          grep -q 'com.vasudha.connect' android/app/build.gradle
          grep -q 'ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
