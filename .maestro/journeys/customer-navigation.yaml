appId: com.vasudha.connect
name: KAMPRO Customer Navigation Smoke
tags:
  - smoke
  - customer
  - navigation
env:
  CUSTOMER_EMAIL: ${CUSTOMER_EMAIL}
  CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD}

---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"
      - tapOn: "I need a professional"
      - tapOn: "Email address"
      - inputText: ${CUSTOMER_EMAIL}
      - tapOn: "Password"
      - inputText: ${CUSTOMER_PASSWORD}
      - tapOn: "Sign in with Email"
- runFlow:
    when:
      visible: "How do you want to use"
    commands:
      - tapOn: "I need a professional"
      - tapOn: "Email address"
      - inputText: ${CUSTOMER_EMAIL}
      - tapOn: "Password"
      - inputText: ${CUSTOMER_PASSWORD}
      - tapOn: "Sign in with Email"
- runFlow:
    when:
      visible: "Welcome Back"
    commands:
      - tapOn: "Email address"
      - inputText: ${CUSTOMER_EMAIL}
      - tapOn: "Password"
      - inputText: ${CUSTOMER_PASSWORD}
      - tapOn: "Sign in with Email"
- extendedWaitUntil:
    visible: "Find trusted professionals"
    timeout: 20000
- tapOn: "Find professionals →"
- assertVisible: "Find Skills Around You"
- assertVisible: "Search a Pro or skill"
- takeScreenshot: customer-find-a-pro
