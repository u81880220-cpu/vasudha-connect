appId: com.vasudha.connect
name: KAMPRO Customer Navigation Smoke
tags:
  - smoke
  - customer
  - navigation
env:
  CUSTOMER_EMAIL: ${CUSTOMER_EMAIL}
  CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD}

---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"
      - extendedWaitUntil:
          visible: "I need a professional"
          timeout: 10000
      - tapOn: "I need a professional"
- runFlow:
    when:
      visible: "How do you want to use"
    commands:
      - tapOn: "I need a professional"
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 20000
- tapOn: "Email"
- tapOn: "KAMPRO email address"
- inputText: ${CUSTOMER_EMAIL}
- tapOn: "KAMPRO password"
- inputText: ${CUSTOMER_PASSWORD}
- hideKeyboard
- tapOn: "Sign in with Email"
- extendedWaitUntil:
    visible: "Find trusted professionals"
    timeout: 30000
- tapOn: "Find professionals →"
- extendedWaitUntil:
    visible: "Find Skills Around You"
    timeout: 15000
- assertVisible: "Search a Pro or skill"
- takeScreenshot: customer-find-a-pro
