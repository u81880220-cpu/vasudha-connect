appId: com.vasudha.connect
name: KAMPRO Professional Navigation Smoke
tags:
  - smoke
  - professional
  - navigation
env:
  PROFESSIONAL_EMAIL: ${PROFESSIONAL_EMAIL}
  PROFESSIONAL_PASSWORD: ${PROFESSIONAL_PASSWORD}

---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"
      - tapOn: "I am a professional"
      - tapOn: "Email address"
      - inputText: ${PROFESSIONAL_EMAIL}
      - tapOn: "Password"
      - inputText: ${PROFESSIONAL_PASSWORD}
      - tapOn: "Sign in with Email"
- runFlow:
    when:
      visible: "How do you want to use"
    commands:
      - tapOn: "I am a professional"
      - tapOn: "Email address"
      - inputText: ${PROFESSIONAL_EMAIL}
      - tapOn: "Password"
      - inputText: ${PROFESSIONAL_PASSWORD}
      - tapOn: "Sign in with Email"
- runFlow:
    when:
      visible: "Welcome Back"
    commands:
      - tapOn: "Use KAMPRO as a Professional"
      - tapOn: "I am a professional"
      - tapOn: "Email address"
      - inputText: ${PROFESSIONAL_EMAIL}
      - tapOn: "Password"
      - inputText: ${PROFESSIONAL_PASSWORD}
      - tapOn: "Sign in with Email"
- extendedWaitUntil:
    visible: "Switch to Customer mode"
    timeout: 20000
- takeScreenshot: professional-home
