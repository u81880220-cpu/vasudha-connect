appId: com.vasudha.connect
name: KAMPRO Customer Login
tags:
  - smoke
  - customer
  - auth
env:
  CUSTOMER_EMAIL: ${CUSTOMER_EMAIL}
  CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD}

---
- launchApp:
    clearState: true
- tapOn: "Email address"
- inputText: ${CUSTOMER_EMAIL}
- tapOn: "Password"
- inputText: ${CUSTOMER_PASSWORD}
- tapOn: "Sign in with Email"
- assertVisible: "Find trusted professionals"
- assertVisible: "Popular services"
- takeScreenshot: customer-home
