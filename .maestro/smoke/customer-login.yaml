appId: com.vasudha.connect
name: KAMPRO Customer Login
tags:
  - smoke
  - customer
  - auth
env:
  CUSTOMER_EMAIL: ${CUSTOMER_EMAIL}
  CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD}

---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Get Started"
    timeout: 20000
- tapOn: "Get Started"
- extendedWaitUntil:
    visible: "I need a professional"
    timeout: 10000
- tapOn: "I need a professional"
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 10000
- tapOn: "Email address"
- inputText: ${CUSTOMER_EMAIL}
- tapOn: "Password"
- inputText: ${CUSTOMER_PASSWORD}
- hideKeyboard
- tapOn: "Sign in with Email"
- extendedWaitUntil:
    visible: "Find trusted professionals"
    timeout: 30000
- assertVisible: "Popular services"
- takeScreenshot: customer-home
